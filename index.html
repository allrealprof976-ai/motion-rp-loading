<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Motion City | Loading</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop"></div>
  <div class="aurora"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>

  <header class="header">
    <div class="brand-mini"><span class="dot"></span><b>MOTION CITY</b><span>ROLEPLAY</span></div>
    <a class="discord" href="https://discord.gg/REPLACE_ME" target="_blank" rel="noreferrer">
      <span><b>JOIN OUR DISCORD</b><small>STAY CONNECTED • GET UPDATES</small></span><strong>→</strong>
    </a>
  </header>

  <!-- Invisible YouTube player: it supplies the background music only. -->
  <div class="youtube-audio" aria-hidden="true"><div id="youtubePlayer"></div></div>

  <!-- Minimal music controls: no panel/box, just buttons floating over the background. -->
  <div class="mini-controls" aria-label="Background music controls">
    <button class="mini-btn" id="prevBtn" title="Previous track">◀</button>
    <button class="mini-btn play" id="playBtn" title="Play/Pause">▶</button>
    <button class="mini-btn" id="nextBtn" title="Next track">▶</button>
    <button class="mini-btn" id="muteBtn" title="Mute/Unmute">🔇</button>
    <input id="volume" type="range" min="0" max="100" value="60" aria-label="Music volume">
    <span id="volText">60%</span>
  </div>

  <section class="quick">
    <h3>QUICK TIPS</h3>
    <p>Use <b>/me</b> for actions, <b>/do</b> for narration, and <b>/ooc</b> for out-of-character chat.</p>
  </section>

  <section class="loading">
    <div class="loading-row"><span>LOADING...</span><b id="percent">0%</b></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="steps">
      <span class="done" id="s1">✓ INITIALIZING</span>
      <span id="s2">○ LOADING ASSETS</span>
      <span id="s3">○ STARTING SCRIPTS</span>
      <span id="s4">○ ENTERING MOTION CITY</span>
    </div>
  </section>

  <div class="status" id="status">CONNECTING TO MOTION CITY...</div>
  <script src="app.js"></script>
</body>
</html>
